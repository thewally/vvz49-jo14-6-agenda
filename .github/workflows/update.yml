name: Update JO14-6 agenda

on:
  schedule:
    # 05:00 en 17:00 UTC = 06/07:00 en 18/19:00 NL-tijd.
    - cron: "0 5,17 * * *"
  workflow_dispatch: {}
  # Direct bijwerken zodra je overige-activiteiten.json (of het script) aanpast.
  push:
    branches: [main]
    paths:
      - overige-activiteiten.json
      - scrape.py

permissions:
  contents: write

# Voorkomt dat een geplande run en een push-run tegelijk willen pushen.
concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scrape.py
        env:
          SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}

      - name: Commit als er wijzigingen zijn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json matches.ics
          git diff --cached --quiet || git commit -m "Update programma"
          git pull --rebase
          git push
