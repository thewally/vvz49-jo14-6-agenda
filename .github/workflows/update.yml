name: Update JO14-6 agenda

on:
  schedule:
    # 05:00 en 17:00 UTC = 06/07:00 en 18/19:00 NL-tijd, ruim voor en na een
    # zaterdagochtend-wedstrijd.
    - cron: "0 5,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scrape.py
        env:
          SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}

      - name: Commit als er wijzigingen zijn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json matches.ics
          git diff --cached --quiet || git commit -m "Update programma"
          git push
